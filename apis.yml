aid: welab
name: WeLab
description: >-
  WeLab is a Hong Kong-headquartered fintech group founded in 2013 (incorporated November 2012 as WeLend) by
  Simon Loong, Kelly Wong and Frances Kang, operating consumer lending, digital banking and payments businesses
  across Hong Kong, mainland China and Indonesia. Its brands include WeLend (Hong Kong online lending),
  WeLab Digital and Taoxinji (mainland China), WeLab Pay, Tianmian Lab, and two licensed digital banks —
  WeLab Bank Limited, one of Hong Kong's virtual banks licensed by the Hong Kong Monetary Authority in April 2019
  and launched to the public in July 2020, and Bank Saqu (formerly Bank Jasa Jakarta) in Indonesia.
  WeLab Bank is the group's API-bearing entity: under the HKMA Open API Framework it publishes an "Open API"
  developer portal for registered third-party service providers, backed by dedicated production and sandbox
  API gateways that require a client certificate (mutual TLS) before any request is served.
  Investors across its funding rounds include Sequoia Capital, Alibaba Entrepreneurs Fund, Credit Suisse and Allianz.
